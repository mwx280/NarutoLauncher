name: 构建与发布

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: 构建 x64（安装包）
    runs-on: windows-latest
    permissions:
      contents: write   # 发布时上传 release 资产

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 MSVC（x64）
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: 还原 CEF 依赖（CEF SDK + 运行时 x64）
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/download_deps.ps1 -Arch x64

      - name: 配置 GameHost（CMake x64）
        shell: pwsh
        run: |
          cmake -S app -B build/app_x64 -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: 构建 GameHost
        shell: pwsh
        run: |
          cmake --build build/app_x64

      - name: 构建 WPF 启动器（win-x64，SelfContained）
        shell: pwsh
        run: |
          $out = "NarutoLauncher/bin/Release/net10.0-windows/win-x64"
          dotnet publish NarutoLauncher/NarutoLauncher.csproj -c Release `
            -p:RuntimeIdentifier=win-x64 -p:PlatformTarget=x64 `
            -p:SelfContained=true -o $out

      - name: 布置 GameHost 到启动器输出
        shell: pwsh
        run: |
          $base = "NarutoLauncher/bin/Release/net10.0-windows/win-x64"
          $out = "$base/GameHost"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Path "build/app_x64/*" -Destination $out -Recurse -Force

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: 构建安装包
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\NarutoLauncher.iss"

      - name: 上传安装包为工件
        uses: actions/upload-artifact@v4
        with:
          name: NarutoLauncher-Setup
          path: publish/NarutoLauncher-*-Setup.exe

      - name: 发布到 GitHub Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/NarutoLauncher-*-Setup.exe
          draft: false
          generate_release_notes: true
