name: 检查

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-check:
    name: 编译检查（x64）
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 MSVC（x64）
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: 还原 CEF 依赖（CEF SDK + 运行时 x64）
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/download_deps.ps1 -Arch x64

      - name: 编译 CEFFlashGameHost（CMake x64）
        shell: pwsh
        run: |
          cmake -S app -B build/app_x64 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/app_x64

      - name: 编译 WPF 启动器（win-x64）
        shell: pwsh
        run: |
          dotnet build NarutoLauncher/NarutoLauncher.csproj -c Release `
            -p:RuntimeIdentifier=win-x64 -p:PlatformTarget=x64

      - name: 校验
        shell: pwsh
        run: |
          # 在整个 bin 树递归查找启动器 exe（dotnet build 输出路径受 Platform/RID 影响而变动）
          $exe = Get-ChildItem -Path "NarutoLauncher/bin" -Recurse -Filter "NarutoLauncher.exe" |
                 Select-Object -First 1
          if (-not $exe) { throw "未找到启动器 exe（bin 树）" }
          Write-Host "启动器: $($exe.FullName)"
          $b = [System.IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $m = [BitConverter]::ToUInt16($b, $pe + 4)
          if ($m -ne 0x8664) { throw "非 x64" }
          Write-Host "编译检查通过（x64）"
